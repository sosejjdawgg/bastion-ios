name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate

      - name: Test shared logic
        continue-on-error: true
        run: |
          set -o pipefail
          cd Core && swift test 2>&1 | tee ../test.log | tail -40

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Bastion.xcodeproj -scheme Bastion -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Bastion.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Bastion.app Payload/
          zip -qry Bastion.ipa Payload
          ls -la Bastion.ipa

      - name: Simulator check (screenshots)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          xcodebuild -project Bastion.xcodeproj -scheme Bastion -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild CODE_SIGNING_ALLOWED=NO build > sim.log 2>&1 \
            || { grep -E "error:" sim.log | head -30; exit 1; }
          APP=simbuild/Build/Products/Release-iphonesimulator/Bastion.app
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          echo "device $UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          run() { name=$1; wait=$2; shift 2; xcrun simctl terminate "$UDID" app.bastion.browser 2>/dev/null; xcrun simctl launch "$UDID" app.bastion.browser "$@"; sleep "$wait"; xcrun simctl io "$UDID" screenshot "shots/$name.png"; }
          run 1-home 120 -seed
          run 2-newsfeed 15 -scrollTo NEWSFEED
          run 3-globe 15 -scrollTo GLOBE
          run 4-media 15 -scrollTo MEDIA
          run 5-entertainment 15 -scrollTo C:
          run 6-web 40 -open https://www.theguardian.com/uk
          run 7-shield 45 -open https://www.theguardian.com/uk -sheet shield -sheetDelay 35
          run 8-youtube 45 -open https://m.youtube.com/
          run 9-report 12 -sheet report
          run 10-controls 12 -sheet controls
          run 11-arrange 12 -sheet arrange
          xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "Bastion"' --style compact 2>/dev/null | tail -150 > shots/app-log.txt || true
          ls -la shots

      - name: Collect logs
        if: always()
        run: |
          { echo "commit: $GITHUB_SHA"; echo "status: ${{ job.status }}"; echo; echo "== errors =="; grep -E "error:" build.log | sort -u | head -200 || true; \
            echo; echo "== tests =="; tail -120 test.log 2>/dev/null || true; } > build-report.txt
          cp build.log build-full.log 2>/dev/null || touch build-full.log

      - name: Publish logs
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-logs
          name: CI logs
          prerelease: true
          files: |
            build-report.txt
            build-full.log
            shots/*

      - name: Publish IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bastion for iOS (latest build)
          body: |
            Unsigned build for sideloading with Sideloadly or AltStore. Built from ${{ github.sha }}.
          files: Bastion.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Bastion-ipa
          path: Bastion.ipa
